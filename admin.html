<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Panel de Administración - SGTA-UPLA">
  <title>SGTA-UPLA | Panel de Administración</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="dashboard">
    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-brand">
          <div class="sidebar-brand-icon" id="sidebar-icon"></div>
          <div class="sidebar-brand-text">
            <h2>Panel Admin</h2>
            <p>SGTA-UPLA</p>
          </div>
        </div>
      </div>

      <nav class="sidebar-nav">
        <div class="sidebar-menu" id="sidebar-menu"></div>
      </nav>

      <div class="sidebar-footer">
        <button id="logout-btn" class="logout-btn">
          <span id="logout-icon"></span>
          <span class="logout-text">Cerrar Sesión</span>
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <div class="main-wrapper">
      <!-- Header -->
      <header class="header">
        <div class="header-inner">
          <div class="header-left">
            <button id="toggle-sidebar" class="toggle-sidebar-btn"></button>
            <div class="search-box">
              <span id="search-icon"></span>
              <input type="text" id="search-input" placeholder="Buscar usuarios, roles, actividades...">
            </div>
          </div>
          <div class="header-right">
            <button class="notification-btn">
              <span id="bell-icon"></span>
              <span class="notification-dot"></span>
            </button>
            <div class="user-info">
              <div class="user-info-text">
                <p class="user-name">Administrador</p>
                <p class="user-role">Admin del Sistema</p>
              </div>
              <div class="user-avatar avatar-admin" id="user-avatar-icon"></div>
            </div>
          </div>
        </div>
      </header>

      <!-- Main Content Area -->
      <main class="main-content" id="main-content"></main>
    </div>
  </div>

  <!-- Modal: Crear/Editar Usuario -->
  <div id="modal-overlay" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modal-title">Crear Usuario</h2>
        <button class="modal-close" onclick="closeUserModal()">&times;</button>
      </div>
      <div class="modal-body">
        <form id="user-form" class="form-grid">
          <input type="hidden" id="user-id">
          <div class="form-group">
            <label class="form-label">Nombre Completo</label>
            <input type="text" id="user-name" class="form-input" required>
          </div>
          <div class="form-group">
            <label class="form-label">Email Institucional</label>
            <input type="email" id="user-email" class="form-input" required>
          </div>
          <div class="form-group">
            <label class="form-label">Contraseña</label>
            <div style="position: relative;">
              <input type="password" id="user-password" class="form-input" placeholder="Para nuevos usuarios" required style="padding-right: 2.5rem;">
              <button type="button" class="password-toggle" id="toggle-user-password" title="Mostrar/ocultar contraseña" style="position: absolute; right: 0.5rem; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--gray-500);"></button>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Rol</label>
            <select id="user-role" class="form-select" required>
              <option value="Estudiante Delegado">Estudiante Delegado</option>
              <option value="Tutor">Tutor</option>
              <option value="Administrador">Administrador</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Ciclo (Opcional)</label>
            <input type="text" id="user-ciclo" class="form-input" placeholder="Ej: VIII">
          </div>
          <div class="form-group">
            <label class="form-label">Especialidad (Tutores)</label>
            <input type="text" id="user-especialidad" class="form-input" placeholder="Ej: Matemáticas">
          </div>
          <div class="form-group">
            <label class="form-label">Estado</label>
            <select id="user-state" class="form-select" required>
              <option value="Activo">Activo</option>
              <option value="Inactivo">Inactivo</option>
            </select>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-gray" onclick="closeUserModal()">Cancelar</button>
        <button class="btn btn-blue" id="btn-save-user" onclick="saveUser()">Guardar</button>
      </div>
    </div>
  </div>

  <!-- Modal: Crear/Editar Tutoría -->
  <div id="tutoria-modal-overlay" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h2 id="tutoria-modal-title">Crear Tutoría</h2>
        <button class="modal-close" onclick="closeTutoriaModal()">&times;</button>
      </div>
      <div class="modal-body">
        <form id="tutoria-form" class="form-grid">
          <input type="hidden" id="tutoria-id">
          <div class="form-group">
            <label class="form-label">Estudiante</label>
            <select id="tutoria-estudiante" class="form-select" required></select>
          </div>
          <div class="form-group">
            <label class="form-label">Tutor</label>
            <select id="tutoria-tutor" class="form-select" required></select>
          </div>
          <div class="form-group">
            <label class="form-label">Materia</label>
            <input type="text" id="tutoria-materia" class="form-input" required>
          </div>
          <div class="form-group">
            <label class="form-label">Fecha</label>
            <input type="date" id="tutoria-fecha" class="form-input" required>
          </div>
          <div class="form-group">
            <label class="form-label">Hora</label>
            <input type="time" id="tutoria-hora" class="form-input" required>
          </div>
          <div class="form-group">
            <label class="form-label">Duración</label>
            <select id="tutoria-duracion" class="form-select">
              <option value="30 minutos">30 minutos</option>
              <option value="1 hora" selected>1 hora</option>
              <option value="1.5 horas">1.5 horas</option>
              <option value="2 horas">2 horas</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Modalidad o Ubicación</label>
            <select id="tutoria-ubicacion" class="form-select">
              <option>Virtual</option>
              <option>Sala 201</option>
              <option>Sala 305</option>
              <option>Laboratorio 3</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Estado</label>
            <select id="tutoria-estado" class="form-select">
              <option value="Pendiente">Pendiente</option>
              <option value="Aceptada">Aceptada</option>
              <option value="Rechazada">Rechazada</option>
              <option value="Finalizada">Finalizada</option>
              <option value="Cancelada">Cancelada</option>
            </select>
          </div>
          <div class="form-group" style="grid-column: span 2;">
            <label class="form-label">Observaciones</label>
            <textarea id="tutoria-observaciones" class="form-textarea" placeholder="Observaciones de la tutoría..."></textarea>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-gray" onclick="closeTutoriaModal()">Cancelar</button>
        <button class="btn btn-blue" id="btn-save-tutoria" onclick="saveTutoria()">Guardar</button>
      </div>
    </div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>

  <!-- PDF Generation SDK -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <!-- EmailJS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

  <!-- App Modules -->
  <script src="js/app.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/validators.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/email-service.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
