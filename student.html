<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Panel de Estudiante Delegado - SGTA-UPLA">
  <title>SGTA-UPLA | Panel Estudiante Delegado</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="dashboard">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-brand">
          <div class="sidebar-brand-icon" id="sidebar-icon"></div>
          <div class="sidebar-brand-text">
            <h2>Panel Estudiante</h2>
            <p>Delegado</p>
          </div>
        </div>
      </div>
      <nav class="sidebar-nav"><div class="sidebar-menu" id="sidebar-menu"></div></nav>
      <div class="sidebar-footer">
        <button id="logout-btn" class="logout-btn">
          <span id="logout-icon"></span>
          <span class="logout-text">Cerrar Sesión</span>
        </button>
      </div>
    </aside>

    <div class="main-wrapper">
      <header class="header">
        <div class="header-inner">
          <div class="header-left">
            <button id="toggle-sidebar" class="toggle-sidebar-btn"></button>
            <div class="search-box">
              <span id="search-icon"></span>
              <input type="text" id="search-input" placeholder="Buscar tutores, materias, tutorías...">
            </div>
          </div>
          <div class="header-right">
            <button class="notification-btn"><span id="bell-icon"></span><span class="notification-dot"></span></button>
            <div class="user-info">
              <div class="user-info-text">
                <p class="user-name">Estudiante</p>
                <p class="user-role">Estudiante Delegado</p>
              </div>
              <div class="user-avatar avatar-student"><span>E</span></div>
            </div>
          </div>
        </div>
      </header>
      <main class="main-content" id="main-content"></main>
    </div>
  </div>

  <!-- Modal: Detalles de Tutoría -->
  <div id="tutoria-detalles-modal" class="modal-overlay">
    <div class="modal" style="max-width: 500px;">
      <div class="modal-header">
        <h2>Detalles de la Tutoría</h2>
        <button class="modal-close" onclick="closeStudentTutoriaDetails()">&times;</button>
      </div>
      <div class="modal-body" id="tutoria-detalles-body">
        <!-- Contenido dinámico -->
      </div>
      <div class="modal-footer">
        <button class="btn btn-gray" onclick="closeStudentTutoriaDetails()">Cerrar</button>
      </div>
    </div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

  <!-- App Modules -->
  <script src="js/app.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/validators.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/email-service.js"></script>
  <script src="js/student.js"></script>
</body>
</html>
